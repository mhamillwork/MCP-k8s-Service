{{- if and .Values.gateway.enabled .Values.gateway.certificate.enabled .Values.gateway.certificate.create -}}
{{- $dnsNames := .Values.gateway.certificate.dnsNames -}}
{{- if not $dnsNames -}}
{{- $dnsNames = .Values.gateway.hostnames -}}
{{- end -}}
{{- if not $dnsNames -}}
{{- fail "gateway.certificate.create=true requires gateway.certificate.dnsNames or gateway.hostnames" -}}
{{- end -}}
{{- if not .Values.gateway.certificate.issuerRef.name -}}
{{- fail "gateway.certificate.issuerRef.name is required when gateway.certificate.create=true" -}}
{{- end -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "mcp-server.certificateName" . }}
  labels:
    {{- include "mcp-server.labels" . | nindent 4 }}
    {{- with .Values.gateway.certificate.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.gateway.certificate.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  secretName: {{ include "mcp-server.certificateSecretName" . }}
  dnsNames:
    {{- toYaml $dnsNames | nindent 4 }}
  issuerRef:
    name: {{ .Values.gateway.certificate.issuerRef.name | quote }}
    kind: {{ .Values.gateway.certificate.issuerRef.kind | default "ClusterIssuer" | quote }}
    group: {{ .Values.gateway.certificate.issuerRef.group | default "cert-manager.io" | quote }}
  {{- if .Values.gateway.certificate.commonName }}
  commonName: {{ .Values.gateway.certificate.commonName | quote }}
  {{- else if eq (len $dnsNames) 1 }}
  commonName: {{ index $dnsNames 0 | quote }}
  {{- end }}
  {{- with .Values.gateway.certificate.duration }}
  duration: {{ . | quote }}
  {{- end }}
  {{- with .Values.gateway.certificate.renewBefore }}
  renewBefore: {{ . | quote }}
  {{- end }}
  {{- with .Values.gateway.certificate.privateKey }}
  privateKey:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.gateway.certificate.usages }}
  usages:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
