# Technical Knowledge MCP — service-specific overrides
# VERIFY after src/technical_knowledge_mcp.py is available:
#   - image tag, command/args, MCP transport/endpoint
#   - Neo4j env var names (placeholders below are not final)
#   - probes and ServiceMonitor path

image:
  repository: artifactory.tahaa.local/tahaa-image-local/ai-services/technical-knowledge-mcp
  tag: "1.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: artifactory-registry-secret

replicaCount: 1

# Override after inspecting the real entrypoint / CLI flags.
command: []
args: []

mcp:
  # Preferred; confirm the Python script actually supports Streamable HTTP.
  transport: streamable-http
  endpoint: /mcp

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# PLACEHOLDER env names — verify against technical_knowledge_mcp.py before production.
env:
  - name: NEO4J_URI
    value: "bolt://neo4j-technical.neo4j.svc.cluster.local:7687"
  - name: NEO4J_DATABASE
    value: "technical"
  - name: NEO4J_USERNAME
    valueFrom:
      secretKeyRef:
        name: mcp-technical-knowledge-neo4j
        key: username
  - name: NEO4J_PASSWORD
    valueFrom:
      secretKeyRef:
        name: mcp-technical-knowledge-neo4j
        key: password

envFrom: []

probes:
  startup:
    enabled: true
    type: tcp
  readiness:
    enabled: true
    type: tcp
  liveness:
    enabled: true
    type: tcp

# Enable only after the application exposes a verified Prometheus endpoint.
serviceMonitor:
  enabled: false
  namespace: monitoring
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  labels:
    release: monitoring

persistence:
  enabled: false

rbac:
  create: false

# Gateway API: HTTPS Gateway (routable/LB IP) + HTTPRoute to this ClusterIP Service.
# VERIFY gatewayClassName and certificate.issuerRef against the cluster.
gateway:
  enabled: true
  create: true
  gatewayClassName: cilium
  # Optional static/routable IP (controller-dependent). Leave empty for dynamic LB assignment.
  addresses: []
  # - type: IPAddress
  #   value: 10.50.0.21
  annotations: {}
  hostnames:
    - technical-knowledge-mcp.example.local
  pathPrefix: /mcp
  pathType: PathPrefix
  # Isolated network: HTTPS only.
  http:
    enabled: false
  tls:
    enabled: true
    port: 443
    sectionName: https
    mode: Terminate
  certificate:
    enabled: true
    create: true
    # SANs; defaults to gateway.hostnames when empty.
    dnsNames:
      - technical-knowledge-mcp.example.local
    issuerRef:
      # Internal/air-gapped CA ClusterIssuer (replace with your real issuer name).
      name: internal-ca
      kind: ClusterIssuer
      group: cert-manager.io

# Pin this MCP Deployment to a specific node. Replace with your node name or label.
nodeSelector:
  kubernetes.io/hostname: mcp-worker-01
# tolerations: []
# affinity: {}

networkPolicy:
  enabled: false
  # When enabling, allow Neo4j and DNS egress explicitly.
