{{- if .Values.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "mcp-server.fullname" . }}
  labels:
    {{- include "mcp-server.labels" . | nindent 4 }}
    {{- with .Values.gateway.routeLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.gateway.routeAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- if .Values.gateway.parentRefs }}
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
    {{- else if .Values.gateway.create }}
    - name: {{ include "mcp-server.gatewayName" . }}
      namespace: {{ .Release.Namespace }}
      {{- if .Values.gateway.sectionName }}
      sectionName: {{ .Values.gateway.sectionName | quote }}
      {{- else }}
      sectionName: http
      {{- end }}
    {{- else }}
    {{- fail "gateway.enabled=true requires gateway.parentRefs or gateway.create=true" }}
    {{- end }}
  {{- with .Values.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.gateway.rules }}
    {{- toYaml .Values.gateway.rules | nindent 4 }}
    {{- else }}
    - matches:
        - path:
            type: {{ .Values.gateway.pathType | default "PathPrefix" }}
            value: {{ .Values.gateway.pathPrefix | default .Values.mcp.endpoint | default "/" }}
      backendRefs:
        - name: {{ include "mcp-server.fullname" . }}
          port: {{ .Values.service.port }}
          kind: Service
          weight: 1
    {{- end }}
{{- end }}
