{{- if and .Values.gateway.enabled .Values.gateway.create -}}
{{- if not .Values.gateway.gatewayClassName -}}
{{- fail "gateway.gatewayClassName is required when gateway.create=true (e.g. cilium, istio, nginx, or your cluster GatewayClass)" -}}
{{- end -}}
{{- $hostname := "" -}}
{{- if eq (len .Values.gateway.hostnames) 1 -}}
{{- $hostname = index .Values.gateway.hostnames 0 -}}
{{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "mcp-server.gatewayName" . }}
  labels:
    {{- include "mcp-server.labels" . | nindent 4 }}
    {{- with .Values.gateway.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName | quote }}
  {{- with .Values.gateway.addresses }}
  addresses:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  listeners:
    {{- if .Values.gateway.listeners }}
    {{- toYaml .Values.gateway.listeners | nindent 4 }}
    {{- else }}
    {{- if .Values.gateway.http.enabled }}
    - name: {{ .Values.gateway.http.sectionName | default "http" }}
      protocol: HTTP
      port: {{ .Values.gateway.http.port | default .Values.gateway.listenerPort | default 80 }}
      {{- if $hostname }}
      hostname: {{ $hostname | quote }}
      {{- end }}
      allowedRoutes:
        namespaces:
          from: {{ .Values.gateway.allowedRoutesFrom | default "Same" }}
    {{- end }}
    {{- if .Values.gateway.tls.enabled }}
    - name: {{ .Values.gateway.tls.sectionName | default "https" }}
      protocol: HTTPS
      port: {{ .Values.gateway.tls.port | default 443 }}
      {{- if $hostname }}
      hostname: {{ $hostname | quote }}
      {{- end }}
      tls:
        mode: {{ .Values.gateway.tls.mode | default "Terminate" }}
        certificateRefs:
          {{- if .Values.gateway.tls.certificateRefs }}
          {{- toYaml .Values.gateway.tls.certificateRefs | nindent 10 }}
          {{- else }}
          - kind: Secret
            name: {{ include "mcp-server.certificateSecretName" . }}
            group: ""
          {{- end }}
      allowedRoutes:
        namespaces:
          from: {{ .Values.gateway.allowedRoutesFrom | default "Same" }}
    {{- end }}
    {{- if and (not .Values.gateway.http.enabled) (not .Values.gateway.tls.enabled) }}
    {{- fail "gateway.create=true requires gateway.http.enabled and/or gateway.tls.enabled, or set gateway.listeners explicitly" }}
    {{- end }}
    {{- end }}
{{- end }}
